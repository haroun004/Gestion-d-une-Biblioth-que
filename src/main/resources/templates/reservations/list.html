<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Réservations</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h2><i class="bi bi-bookmark-star"></i>Réservations</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReservationModal">
            <i class="bi bi-plus-lg me-1"></i>Nouvelle réservation
        </button>
    </div>

    <!-- Status filter pills -->
    <div class="d-flex gap-2 align-items-center flex-wrap mb-3">
        <span style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b">Filtrer :</span>
        <a th:href="@{/reservations}"
           style="border-radius:20px;padding:.3rem .85rem;font-size:.8rem;font-weight:500;text-decoration:none;transition:all .15s ease;"
           th:style="${statutFiltre == null} ? 'background:#1e1b4b;color:#fff' : 'background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0'">
            Tous
        </a>
        <a th:each="s : ${statuts}"
           th:href="@{/reservations(statut=${s.name()})}"
           style="border-radius:20px;padding:.3rem .85rem;font-size:.8rem;font-weight:500;text-decoration:none;transition:all .15s ease;"
           th:style="${s == statutFiltre} ?
               (${s.name() == 'EN_ATTENTE'} ? 'background:#fef3c7;color:#92400e;border:1px solid #fde68a' :
               (${s.name() == 'CONFIRMEE'}  ? 'background:#d1fae5;color:#065f46;border:1px solid #a7f3d0' :
                                              'background:#f1f5f9;color:#475569;border:1px solid #cbd5e1'))
               :
               'background:#f8fafc;color:#64748b;border:1px solid #e2e8f0'"
           th:text="${s.name() == 'EN_ATTENTE' ? 'En attente' : (s.name() == 'CONFIRMEE' ? 'Confirmée' : 'Annulée')}">
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Livre</th>
                        <th>Membre</th>
                        <th>Date réservation</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reservationsPage.isEmpty()}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="bi bi-bookmark-star"></i>
                                <div style="font-weight:600;margin-bottom:.25rem">Aucune réservation trouvée</div>
                                <div style="font-size:.8rem">Créez une nouvelle réservation pour un livre non disponible.</div>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="r : ${reservationsPage.content}">
                        <td style="color:#94a3b8;font-size:.8rem" th:text="${r.id}"></td>
                        <td>
                            <div style="font-weight:500;color:#0f172a" th:text="${r.livreTitre}"></div>
                            <div style="font-size:.75rem;color:#94a3b8" th:text="${r.livreAuteur}"></div>
                        </td>
                        <td>
                            <div style="font-weight:500;color:#0f172a;font-size:.875rem" th:text="${r.membreNomComplet}"></div>
                            <div style="font-size:.75rem;color:#94a3b8" th:text="${r.membreEmail}"></div>
                        </td>
                        <td style="font-size:.8rem;color:#64748b"
                            th:text="${#temporals.format(r.dateReservation, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:switch="${r.statut.name()}">
                                <span th:case="'EN_ATTENTE'" class="badge" style="background:#fef3c7;color:#92400e">En attente</span>
                                <span th:case="'CONFIRMEE'"  class="badge" style="background:#d1fae5;color:#065f46">
                                    <i class="bi bi-check2 me-1"></i>Confirmée
                                </span>
                                <span th:case="'ANNULEE'"    class="badge" style="background:#f1f5f9;color:#475569">Annulée</span>
                            </span>
                        </td>
                        <td>
                            <form th:if="${r.statut.name() == 'EN_ATTENTE'}"
                                  th:action="@{/reservations/{id}/annuler(id=${r.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Annuler cette réservation ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm"
                                        style="border:1px solid #fca5a5;background:#fff5f5;color:#dc2626;border-radius:6px;font-size:.78rem;font-weight:500">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </button>
                            </form>
                            <span th:unless="${r.statut.name() == 'EN_ATTENTE'}" style="font-size:.78rem;color:#94a3b8">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${reservationsPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${reservationsPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/reservations(page=${reservationsPage.number - 1}, statut=${statutFiltre})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, reservationsPage.totalPages - 1)}"
                th:classappend="${i == reservationsPage.number} ? 'active'">
                <a class="page-link" th:href="@{/reservations(page=${i}, statut=${statutFiltre})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${reservationsPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/reservations(page=${reservationsPage.number + 1}, statut=${statutFiltre})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ── Modal : Nouvelle réservation ──────────────────────── -->
    <div class="modal fade" id="addReservationModal" tabindex="-1" aria-labelledby="addReservationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width:500px">
            <div class="modal-content" style="border-radius:16px;border:none;box-shadow:0 20px 60px rgba(0,0,0,.18)">

                <div class="modal-header" style="border-bottom:1px solid #e2e8f0;padding:1.25rem 1.5rem">
                    <div style="display:flex;align-items:center;gap:.65rem">
                        <div class="stat-icon indigo" style="width:36px;height:36px;font-size:.95rem;flex-shrink:0">
                            <i class="bi bi-bookmark-plus"></i>
                        </div>
                        <h5 class="modal-title mb-0 fw-bold" id="addReservationModalLabel">Nouvelle réservation</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-4">
                    <form th:action="@{/reservations/sauvegarder}" th:object="${reservationForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div>
                            <label class="form-label">Livre indisponible <span style="color:#dc2626">*</span></label>
                            <select th:field="*{livreId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('livreId')} ? 'is-invalid'">
                                <option value="">— Sélectionnez un livre —</option>
                                <option th:each="l : ${livres}"
                                        th:value="${l.id}"
                                        th:text="${l.titre + ' — ' + l.auteur + (l.quantiteDisponible == 0 ? ' (indisponible)' : ' (' + l.quantiteDisponible + ' dispo)')}"
                                        th:selected="${l.id == reservationForm.livreId}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{livreId}"></div>
                        </div>

                        <div style="margin-top:.8rem">
                            <label class="form-label">Membre <span style="color:#dc2626">*</span></label>
                            <select th:field="*{membreId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('membreId')} ? 'is-invalid'">
                                <option value="">— Sélectionnez un membre actif —</option>
                                <option th:each="m : ${membres}"
                                        th:value="${m.id}"
                                        th:text="${m.prenom + ' ' + m.nom + '  ·  ' + m.email}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{membreId}"></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end" style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0">
                            <button type="button" class="btn"
                                    style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155"
                                    data-bs-dismiss="modal">Annuler</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-bookmark-check me-1"></i>Réserver
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Auto-open modal when arriving from livres page with a pre-filled livreId -->
    <script th:if="${reservationForm.livreId != null}">
        document.addEventListener('DOMContentLoaded', function () {
            new bootstrap.Modal(document.getElementById('addReservationModal')).show();
        });
    </script>

</div>
</body>
</html>
