<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Tableau de bord</title></head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Tableau de bord</h2>

    <div class="row g-4 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card border-primary h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-journals text-primary" style="font-size:2.5rem"></i>
                    <div>
                        <div class="fs-2 fw-bold" th:text="${totalLivres}">0</div>
                        <div class="text-muted">Livres</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card border-success h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-people text-success" style="font-size:2.5rem"></i>
                    <div>
                        <div class="fs-2 fw-bold" th:text="${totalMembres}">0</div>
                        <div class="text-muted">Membres</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card border-warning h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-arrow-left-right text-warning" style="font-size:2.5rem"></i>
                    <div>
                        <div class="fs-2 fw-bold" th:text="${empruntsEnCours}">0</div>
                        <div class="text-muted">Emprunts en cours</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card border-danger h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-clock-history text-danger" style="font-size:2.5rem"></i>
                    <div>
                        <div class="fs-2 fw-bold" th:text="${empruntsEnRetard}">0</div>
                        <div class="text-muted">En retard</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <a th:href="@{/livres/nouveau}" class="btn btn-primary w-100 py-3">
                <i class="bi bi-plus-circle me-2"></i>Ajouter un livre
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/membres/nouveau}" class="btn btn-success w-100 py-3">
                <i class="bi bi-person-plus me-2"></i>Ajouter un membre
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/emprunts/nouveau}" class="btn btn-warning w-100 py-3">
                <i class="bi bi-arrow-right-circle me-2"></i>Nouvel emprunt
            </a>
        </div>
    </div>
</div>
</body>
</html>
