<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Tableau de bord</title></head>
<body>
<div layout:fragment="content">

    <!-- Page header -->
    <div class="page-header">
        <h2><i class="bi bi-speedometer2"></i>Tableau de bord</h2>
        <span class="text-muted" style="font-size:.8rem">
            <i class="bi bi-calendar3 me-1"></i>
            <span id="today-date"></span>
        </span>
    </div>

    <!-- ── Stat cards ─────────────────────────────────────────── -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon blue"><i class="bi bi-journals"></i></div>
                <div>
                    <div style="font-size:1.75rem;font-weight:700;line-height:1;color:#0f172a"
                         th:text="${totalLivres}">0</div>
                    <div style="font-size:.8rem;color:#64748b;margin-top:.2rem">Livres catalogués</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon green"><i class="bi bi-people"></i></div>
                <div>
                    <div style="font-size:1.75rem;font-weight:700;line-height:1;color:#0f172a"
                         th:text="${totalMembres}">0</div>
                    <div style="font-size:.8rem;color:#64748b;margin-top:.2rem">Membres inscrits</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon amber"><i class="bi bi-arrow-left-right"></i></div>
                <div>
                    <div style="font-size:1.75rem;font-weight:700;line-height:1;color:#0f172a"
                         th:text="${empruntsEnCours}">0</div>
                    <div style="font-size:.8rem;color:#64748b;margin-top:.2rem">Emprunts en cours</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon red"><i class="bi bi-clock-history"></i></div>
                <div>
                    <div style="font-size:1.75rem;font-weight:700;line-height:1;color:#0f172a"
                         th:text="${empruntsEnRetard}">0</div>
                    <div style="font-size:.8rem;color:#64748b;margin-top:.2rem">Livres en retard</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Quick actions ─────────────────────────────────────── -->
    <div class="mb-4">
        <h6 style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#64748b;margin-bottom:1rem">
            Actions rapides
        </h6>
        <div class="row g-3">
            <div class="col-md-4">
                <a th:href="@{/livres/nouveau}"
                   style="display:flex;align-items:center;gap:.85rem;padding:1rem 1.25rem;background:#fff;border:1.5px solid #e0e7ff;border-radius:12px;text-decoration:none;transition:all .15s ease;"
                   onmouseover="this.style.borderColor='#4f46e5';this.style.boxShadow='0 4px 12px rgba(79,70,229,.12)'"
                   onmouseout="this.style.borderColor='#e0e7ff';this.style.boxShadow='none'">
                    <div class="stat-icon blue" style="width:42px;height:42px;font-size:1.15rem;flex-shrink:0">
                        <i class="bi bi-plus-lg"></i>
                    </div>
                    <div>
                        <div style="font-weight:600;font-size:.9rem;color:#0f172a">Ajouter un livre</div>
                        <div style="font-size:.775rem;color:#64748b">Enrichir le catalogue</div>
                    </div>
                    <i class="bi bi-chevron-right ms-auto" style="color:#cbd5e1;font-size:.8rem"></i>
                </a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/membres/nouveau}"
                   style="display:flex;align-items:center;gap:.85rem;padding:1rem 1.25rem;background:#fff;border:1.5px solid #d1fae5;border-radius:12px;text-decoration:none;transition:all .15s ease;"
                   onmouseover="this.style.borderColor='#059669';this.style.boxShadow='0 4px 12px rgba(5,150,105,.12)'"
                   onmouseout="this.style.borderColor='#d1fae5';this.style.boxShadow='none'">
                    <div class="stat-icon green" style="width:42px;height:42px;font-size:1.15rem;flex-shrink:0">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <div>
                        <div style="font-weight:600;font-size:.9rem;color:#0f172a">Ajouter un membre</div>
                        <div style="font-size:.775rem;color:#64748b">Inscrire un nouvel adhérent</div>
                    </div>
                    <i class="bi bi-chevron-right ms-auto" style="color:#cbd5e1;font-size:.8rem"></i>
                </a>
            </div>
            <div class="col-md-4">
                <a th:href="@{/emprunts/nouveau}"
                   style="display:flex;align-items:center;gap:.85rem;padding:1rem 1.25rem;background:#fff;border:1.5px solid #fef3c7;border-radius:12px;text-decoration:none;transition:all .15s ease;"
                   onmouseover="this.style.borderColor='#f59e0b';this.style.boxShadow='0 4px 12px rgba(245,158,11,.12)'"
                   onmouseout="this.style.borderColor='#fef3c7';this.style.boxShadow='none'">
                    <div class="stat-icon amber" style="width:42px;height:42px;font-size:1.15rem;flex-shrink:0">
                        <i class="bi bi-arrow-right-circle"></i>
                    </div>
                    <div>
                        <div style="font-weight:600;font-size:.9rem;color:#0f172a">Nouvel emprunt</div>
                        <div style="font-size:.775rem;color:#64748b">Enregistrer un prêt</div>
                    </div>
                    <i class="bi bi-chevron-right ms-auto" style="color:#cbd5e1;font-size:.8rem"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- ── Navigation shortcuts ───────────────────────────────── -->
    <div>
        <h6 style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#64748b;margin-bottom:1rem">
            Navigation
        </h6>
        <div class="row g-3">
            <div class="col-sm-4">
                <a th:href="@{/livres}" class="text-decoration-none">
                    <div class="card p-3 d-flex flex-row align-items-center gap-3"
                         style="transition:box-shadow .15s ease;"
                         onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.09)'"
                         onmouseout="this.style.boxShadow=''">
                        <div class="stat-icon blue" style="width:40px;height:40px;font-size:1.1rem">
                            <i class="bi bi-journals"></i>
                        </div>
                        <div>
                            <div style="font-weight:600;font-size:.875rem;color:#0f172a">Catalogue</div>
                            <div style="font-size:.775rem;color:#64748b" th:text="${totalLivres + ' livres'}"></div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-sm-4">
                <a th:href="@{/membres}" class="text-decoration-none">
                    <div class="card p-3 d-flex flex-row align-items-center gap-3"
                         style="transition:box-shadow .15s ease;"
                         onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.09)'"
                         onmouseout="this.style.boxShadow=''">
                        <div class="stat-icon green" style="width:40px;height:40px;font-size:1.1rem">
                            <i class="bi bi-people"></i>
                        </div>
                        <div>
                            <div style="font-weight:600;font-size:.875rem;color:#0f172a">Membres</div>
                            <div style="font-size:.775rem;color:#64748b" th:text="${totalMembres + ' inscrits'}"></div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-sm-4">
                <a th:href="@{/emprunts}" class="text-decoration-none">
                    <div class="card p-3 d-flex flex-row align-items-center gap-3"
                         style="transition:box-shadow .15s ease;"
                         onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.09)'"
                         onmouseout="this.style.boxShadow=''">
                        <div class="stat-icon amber" style="width:40px;height:40px;font-size:1.1rem">
                            <i class="bi bi-arrow-left-right"></i>
                        </div>
                        <div>
                            <div style="font-weight:600;font-size:.875rem;color:#0f172a">Emprunts</div>
                            <div style="font-size:.775rem;color:#64748b" th:text="${empruntsEnCours + ' en cours'}"></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('today-date').textContent =
        new Date().toLocaleDateString('fr-FR', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
</script>
</body>
</html>
