<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Connexion — Bibliothèque FST</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
        }

        /* ── Layout ──────────────────────────────────────── */
        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* ── Left panel ──────────────────────────────────── */
        .login-left {
            flex: 1;
            background: linear-gradient(145deg, #1e1b4b 0%, #312e81 45%, #4f46e5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
        }
        .login-left::before {
            content: '';
            position: absolute;
            width: 350px; height: 350px;
            border-radius: 50%;
            background: rgba(167,139,250,.1);
            top: -80px; right: -80px;
        }
        .login-left::after {
            content: '';
            position: absolute;
            width: 250px; height: 250px;
            border-radius: 50%;
            background: rgba(167,139,250,.07);
            bottom: -60px; left: -60px;
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: 2rem;
            z-index: 1;
        }
        .login-brand-icon {
            width: 48px; height: 48px;
            background: rgba(255,255,255,.15);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,.2);
        }
        .login-brand-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.02em;
        }
        .login-brand-sub {
            font-size: .75rem;
            color: rgba(255,255,255,.55);
            font-weight: 400;
            display: block;
        }
        #lottie-container {
            width: 320px;
            height: 260px;
            z-index: 1;
            margin-bottom: 1.5rem;
        }
        .login-tagline {
            text-align: center;
            z-index: 1;
        }
        .login-tagline h2 {
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -.02em;
            margin: 0 0 .4rem;
        }
        .login-tagline p {
            color: rgba(255,255,255,.6);
            font-size: .875rem;
            margin: 0;
        }

        /* ── Right panel ─────────────────────────────────── */
        .login-right {
            width: 460px;
            min-width: 380px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2.5rem;
        }
        .login-form-wrapper {
            width: 100%;
            max-width: 360px;
        }
        .login-form-header {
            margin-bottom: 2rem;
        }
        .login-form-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -.03em;
            margin: 0 0 .3rem;
        }
        .login-form-header p {
            font-size: .875rem;
            color: #64748b;
            margin: 0;
        }
        .form-label {
            font-size: .8125rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: .35rem;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: .65rem .9rem;
            font-size: .9rem;
            color: #0f172a;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
            outline: none;
        }
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon-wrapper .form-control {
            padding-left: 2.6rem;
        }
        .input-icon {
            position: absolute;
            left: .85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: .95rem;
            pointer-events: none;
        }
        .btn-signin {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: .9375rem;
            font-weight: 600;
            padding: .75rem;
            cursor: pointer;
            transition: opacity .15s ease, transform .1s ease, box-shadow .15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }
        .btn-signin:hover {
            opacity: .92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79,70,229,.35);
        }
        .btn-signin:active { transform: translateY(0); }

        .alert {
            border-radius: 10px;
            border: none;
            font-size: .8375rem;
            padding: .7rem 1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .alert-danger  { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #d1fae5; color: #065f46; }

        .divider {
            position: relative;
            text-align: center;
            margin: 1.5rem 0;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 1px;
            background: #e2e8f0;
        }
        .divider span {
            position: relative;
            background: #fff;
            padding: 0 .75rem;
            font-size: .75rem;
            color: #94a3b8;
        }

        .credentials-hint {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: .75rem 1rem;
            font-size: .78rem;
            color: #64748b;
        }
        .credentials-hint strong { color: #334155; }

        /* ── Responsive ──────────────────────────────────── */
        @media (max-width: 768px) {
            .login-left { display: none; }
            .login-right { width: 100%; min-width: unset; padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- ── Left — Branding + Animation ────────────────── -->
    <div class="login-left">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="bi bi-book-half"></i></div>
            <div>
                <div class="login-brand-text">Bibliothèque FST</div>
                <span class="login-brand-sub">Faculté des Sciences de Tunis</span>
            </div>
        </div>

        <div id="lottie-container"></div>

        <div class="login-tagline">
            <h2>Bienvenue !</h2>
            <p>Gérez vos livres, membres et emprunts<br/>depuis une seule interface.</p>
        </div>
    </div>

    <!-- ── Right — Login Form ──────────────────────────── -->
    <div class="login-right">
        <div class="login-form-wrapper">

            <div class="login-form-header">
                <h1>Se connecter</h1>
                <p>Entrez vos identifiants pour accéder à l'application.</p>
            </div>

            <!-- Alerts -->
            <div th:if="${param.error}" class="alert alert-danger mb-3">
                <i class="bi bi-exclamation-circle-fill"></i>
                Identifiants incorrects. Veuillez réessayer.
            </div>
            <div th:if="${param.logout}" class="alert alert-success mb-3">
                <i class="bi bi-check-circle-fill"></i>
                Vous avez été déconnecté avec succès.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label" for="username">Identifiant</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="username" name="username"
                               class="form-control" placeholder="admin ou user" autofocus/>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="••••••••"/>
                    </div>
                </div>

                <button type="submit" class="btn-signin">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Se connecter
                </button>
            </form>

        </div>
    </div>
</div>

<!-- Lottie — plain src bypasses webjars-locator during template render -->
<script src="/webjars/lottie-web/5.12.2/build/player/lottie.min.js"></script>
<script>
    if (typeof lottie !== 'undefined') {
        lottie.loadAnimation({
            container: document.getElementById('lottie-container'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '/animations/login.json'
        });
    }
</script>
</body>
</html>
