<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Nouvel emprunt</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/emprunts}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0">Nouvel emprunt</h2>
    </div>

    <div class="card" style="max-width:500px">
        <div class="card-body">
            <form th:action="@{/emprunts/sauvegarder}" th:object="${emprunt}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Livre *</label>
                    <select th:field="*{livre}" class="form-select"
                            th:classappend="${#fields.hasErrors('livre')} ? 'is-invalid'">
                        <option value="">-- Choisir un livre --</option>
                        <option th:each="l : ${livres}"
                                th:value="${l.id}"
                                th:text="${l.titre + ' (' + l.quantiteDisponible + ' dispo)'}"
                                th:disabled="${l.quantiteDisponible == 0}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{livre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Membre *</label>
                    <select th:field="*{membre}" class="form-select"
                            th:classappend="${#fields.hasErrors('membre')} ? 'is-invalid'">
                        <option value="">-- Choisir un membre --</option>
                        <option th:each="m : ${membres}"
                                th:value="${m.id}"
                                th:text="${m.prenom + ' ' + m.nom + ' (' + m.email + ')'}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{membre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Date de retour prévue *</label>
                    <input type="date" th:field="*{dateRetourPrevue}" class="form-control"
                           th:classappend="${#fields.hasErrors('dateRetourPrevue')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{dateRetourPrevue}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save me-1"></i>Créer l'emprunt
                    </button>
                    <a th:href="@{/emprunts}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
