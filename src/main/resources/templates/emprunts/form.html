<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Nouvel emprunt</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/emprunts}" class="btn-back"><i class="bi bi-arrow-left"></i></a>
            <h2>Nouvel emprunt</h2>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form th:action="@{/emprunts/sauvegarder}" th:object="${empruntForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-1">
                    <label class="form-label">Livre à emprunter <span style="color:#dc2626">*</span></label>
                    <select th:field="*{livreId}" class="form-select"
                            th:classappend="${#fields.hasErrors('livreId')} ? 'is-invalid'">
                        <option value="">— Sélectionnez un livre —</option>
                        <option th:each="l : ${livres}"
                                th:value="${l.id}"
                                th:text="${l.titre + ' — ' + l.auteur + ' (' + l.quantiteDisponible + ' dispo)'}"
                                th:disabled="${l.quantiteDisponible == 0}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{livreId}"></div>
                    <div style="font-size:.75rem;color:#64748b;margin-top:.3rem">Les livres sans stock sont grisés.</div>
                </div>

                <div style="margin-top:.9rem">
                    <label class="form-label">Membre emprunteur <span style="color:#dc2626">*</span></label>
                    <select th:field="*{membreId}" class="form-select"
                            th:classappend="${#fields.hasErrors('membreId')} ? 'is-invalid'">
                        <option value="">— Sélectionnez un membre actif —</option>
                        <option th:each="m : ${membres}"
                                th:value="${m.id}"
                                th:text="${m.prenom + ' ' + m.nom + '  ·  ' + m.email}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{membreId}"></div>
                </div>

                <div style="margin-top:.9rem">
                    <label class="form-label">Date de retour prévue <span style="color:#dc2626">*</span></label>
                    <input type="date" th:field="*{dateRetourPrevue}" class="form-control"
                           style="max-width:220px"
                           th:classappend="${#fields.hasErrors('dateRetourPrevue')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{dateRetourPrevue}"></div>
                    <div style="font-size:.75rem;color:#64748b;margin-top:.3rem">Doit être une date dans le futur.</div>
                </div>

                <hr style="border-color:#e2e8f0;margin:1.5rem 0 1rem">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Créer l'emprunt
                    </button>
                    <a th:href="@{/emprunts}" class="btn"
                       style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
