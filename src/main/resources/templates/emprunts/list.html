<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Emprunts</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h2><i class="bi bi-arrow-left-right"></i>Emprunts</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmpruntModal">
            <i class="bi bi-plus-lg me-1"></i>Nouvel emprunt
        </button>
    </div>

    <!-- Status filter pills -->
    <div class="d-flex gap-2 align-items-center flex-wrap mb-3">
        <span style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b">Filtrer :</span>
        <a th:href="@{/emprunts}"
           style="border-radius:20px;padding:.3rem .85rem;font-size:.8rem;font-weight:500;text-decoration:none;transition:all .15s ease;"
           th:style="${statutFiltre == null} ? 'background:#1e1b4b;color:#fff' : 'background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0'">
            Tous
        </a>
        <a th:each="s : ${statuts}"
           th:href="@{/emprunts(statut=${s.name()})}"
           style="border-radius:20px;padding:.3rem .85rem;font-size:.8rem;font-weight:500;text-decoration:none;transition:all .15s ease;"
           th:style="${s == statutFiltre} ?
               (${s.name() == 'EN_COURS'}  ? 'background:#fef3c7;color:#92400e;border:1px solid #fde68a' :
               (${s.name() == 'RENDU'}     ? 'background:#d1fae5;color:#065f46;border:1px solid #a7f3d0' :
                                             'background:#fee2e2;color:#991b1b;border:1px solid #fca5a5'))
               :
               'background:#f8fafc;color:#64748b;border:1px solid #e2e8f0'"
           th:text="${s.name() == 'EN_COURS' ? 'En cours' : (s.name() == 'RENDU' ? 'Rendu' : 'En retard')}">
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Livre</th>
                        <th>Membre</th>
                        <th>Emprunté le</th>
                        <th>Retour prévu</th>
                        <th>Retour effectif</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${empruntsPage.isEmpty()}">
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="bi bi-arrow-left-right"></i>
                                <div style="font-weight:600;margin-bottom:.25rem">Aucun emprunt trouvé</div>
                                <div style="font-size:.8rem">Créez un nouvel emprunt depuis le bouton ci-dessus.</div>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="emprunt : ${empruntsPage.content}">
                        <td style="color:#94a3b8;font-size:.8rem" th:text="${emprunt.id}"></td>
                        <td style="font-weight:500;color:#0f172a;max-width:180px">
                            <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                                 th:text="${emprunt.livretitre}"></div>
                        </td>
                        <td>
                            <div style="font-weight:500;color:#0f172a;font-size:.875rem" th:text="${emprunt.membreNomComplet}"></div>
                            <div style="font-size:.75rem;color:#94a3b8" th:text="${emprunt.membreEmail}"></div>
                        </td>
                        <td style="font-size:.8rem;color:#64748b"
                            th:text="${#temporals.format(emprunt.dateEmprunt, 'dd/MM/yyyy')}"></td>
                        <td style="font-size:.8rem"
                            th:text="${#temporals.format(emprunt.dateRetourPrevue, 'dd/MM/yyyy')}"
                            th:style="${emprunt.statut.name() == 'EN_RETARD'} ? 'color:#dc2626;font-weight:600' : 'color:#64748b'"></td>
                        <td style="font-size:.8rem;color:#64748b"
                            th:text="${emprunt.dateRetourEffective != null} ? ${#temporals.format(emprunt.dateRetourEffective, 'dd/MM/yyyy')} : '—'"></td>
                        <td>
                            <span th:switch="${emprunt.statut.name()}">
                                <span th:case="'EN_COURS'" class="badge" style="background:#fef3c7;color:#92400e">En cours</span>
                                <span th:case="'RENDU'"    class="badge" style="background:#d1fae5;color:#065f46">Rendu</span>
                                <span th:case="'EN_RETARD'" class="badge" style="background:#fee2e2;color:#991b1b">
                                    <i class="bi bi-exclamation-circle me-1"></i>En retard
                                </span>
                            </span>
                        </td>
                        <td>
                            <form th:if="${!emprunt.rendu}"
                                  th:action="@{/emprunts/{id}/retour(id=${emprunt.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Enregistrer le retour de ce livre ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm"
                                        style="border:1px solid #a7f3d0;background:#f0fdf4;color:#059669;border-radius:6px;font-size:.78rem;font-weight:500">
                                    <i class="bi bi-check2"></i> Retour
                                </button>
                            </form>
                            <span th:if="${emprunt.rendu}" style="font-size:.78rem;color:#94a3b8">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${empruntsPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${empruntsPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/emprunts(page=${empruntsPage.number - 1}, statut=${statutFiltre})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, empruntsPage.totalPages - 1)}"
                th:classappend="${i == empruntsPage.number} ? 'active'">
                <a class="page-link" th:href="@{/emprunts(page=${i}, statut=${statutFiltre})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${empruntsPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/emprunts(page=${empruntsPage.number + 1}, statut=${statutFiltre})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ── Modal : Nouvel emprunt ─────────────────────────────── -->
    <div class="modal fade" id="addEmpruntModal" tabindex="-1" aria-labelledby="addEmpruntModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width:500px">
            <div class="modal-content" style="border-radius:16px;border:none;box-shadow:0 20px 60px rgba(0,0,0,.18)">

                <div class="modal-header" style="border-bottom:1px solid #e2e8f0;padding:1.25rem 1.5rem">
                    <div style="display:flex;align-items:center;gap:.65rem">
                        <div class="stat-icon amber" style="width:36px;height:36px;font-size:.95rem;flex-shrink:0">
                            <i class="bi bi-arrow-right-circle"></i>
                        </div>
                        <h5 class="modal-title mb-0 fw-bold" id="addEmpruntModalLabel">Nouvel emprunt</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-4">
                    <form th:action="@{/emprunts/sauvegarder}" th:object="${empruntForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div>
                            <label class="form-label">Livre <span style="color:#dc2626">*</span></label>
                            <select th:field="*{livreId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('livreId')} ? 'is-invalid'">
                                <option value="">— Sélectionnez un livre —</option>
                                <option th:each="l : ${livres}"
                                        th:value="${l.id}"
                                        th:text="${l.titre + ' — ' + l.auteur + ' (' + l.quantiteDisponible + ' dispo)'}"
                                        th:disabled="${l.quantiteDisponible == 0}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{livreId}"></div>
                        </div>

                        <div style="margin-top:.8rem">
                            <label class="form-label">Membre <span style="color:#dc2626">*</span></label>
                            <select th:field="*{membreId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('membreId')} ? 'is-invalid'">
                                <option value="">— Sélectionnez un membre actif —</option>
                                <option th:each="m : ${membres}"
                                        th:value="${m.id}"
                                        th:text="${m.prenom + ' ' + m.nom + '  ·  ' + m.email}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{membreId}"></div>
                        </div>

                        <div style="margin-top:.8rem">
                            <label class="form-label">Date de retour prévue <span style="color:#dc2626">*</span></label>
                            <input type="date" th:field="*{dateRetourPrevue}" class="form-control"
                                   th:classappend="${#fields.hasErrors('dateRetourPrevue')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{dateRetourPrevue}"></div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end" style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0">
                            <button type="button" class="btn"
                                    style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155"
                                    data-bs-dismiss="modal">Annuler</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Créer l'emprunt
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
