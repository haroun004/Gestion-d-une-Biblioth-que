<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE — Bibliothèque FST">Bibliothèque FST</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <style>
        /* ── Design Tokens ─────────────────────────────────────── */
        :root {
            --indigo-950: #0e0b2e;
            --indigo-900: #1e1b4b;
            --indigo-800: #312e81;
            --indigo-600: #4f46e5;
            --indigo-100: #e0e7ff;
            --indigo-50:  #eef2ff;
            --violet-400: #a78bfa;
            --violet-200: #ddd6fe;
            --slate-900:  #0f172a;
            --slate-700:  #334155;
            --slate-500:  #64748b;
            --slate-300:  #cbd5e1;
            --slate-200:  #e2e8f0;
            --slate-100:  #f1f5f9;
            --slate-50:   #f8fafc;
            --emerald-600: #059669;
            --emerald-100: #d1fae5;
            --amber-500:   #f59e0b;
            --amber-100:   #fef3c7;
            --red-600:     #dc2626;
            --red-100:     #fee2e2;
            --blue-600:    #2563eb;
            --blue-100:    #dbeafe;
        }

        /* ── Base ───────────────────────────────────────────────── */
        body {
            background: var(--slate-100);
            color: var(--slate-900);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: .9375rem;
        }

        /* ── Sidebar ─────────────────────────────────────────────── */
        .sidebar {
            background: linear-gradient(180deg, var(--indigo-900) 0%, var(--indigo-950) 100%);
            min-height: 100vh;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,.1) transparent;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: 1.25rem 1rem 1rem;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -.02em;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,.07);
            margin-bottom: .75rem;
        }
        .sidebar-brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--indigo-600), var(--violet-400));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.55);
            border-radius: 8px;
            padding: .6rem .85rem;
            display: flex;
            align-items: center;
            gap: .6rem;
            font-size: .875rem;
            font-weight: 500;
            transition: all .15s ease;
            position: relative;
        }
        .sidebar .nav-link i { font-size: 1rem; }
        .sidebar .nav-link:hover {
            color: rgba(255,255,255,.9);
            background: rgba(255,255,255,.08);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background: rgba(167,139,250,.18);
        }
        .sidebar .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 3px;
            background: var(--violet-400);
            border-radius: 0 3px 3px 0;
        }
        .sidebar-footer {
            border-top: 1px solid rgba(255,255,255,.07);
            padding: .85rem 1rem;
            margin-top: auto;
        }
        .sidebar-user {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: .65rem;
        }
        .sidebar-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo-600), var(--violet-400));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .sidebar-username {
            font-size: .8rem;
            font-weight: 500;
            color: rgba(255,255,255,.7);
        }
        .btn-logout {
            width: 100%;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
            border-radius: 8px;
            font-size: .8rem;
            font-weight: 500;
            padding: .45rem;
            transition: all .15s ease;
        }
        .btn-logout:hover {
            background: rgba(239,68,68,.22);
            color: #fecaca;
        }

        /* ── Main content ────────────────────────────────────────── */
        .main-content { min-height: 100vh; }

        /* ── Page header ─────────────────────────────────────────── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--slate-200);
        }
        .page-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--slate-900);
            margin: 0;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .page-header h2 i { color: var(--indigo-600); }

        /* ── Cards ───────────────────────────────────────────────── */
        .card {
            border: 1px solid var(--slate-200);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            background: #fff;
        }

        /* ── Stat cards ──────────────────────────────────────────── */
        .stat-card {
            border: 1px solid var(--slate-200);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,.08);
        }
        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .stat-icon.blue   { background: var(--blue-100);    color: var(--blue-600);    }
        .stat-icon.green  { background: var(--emerald-100); color: var(--emerald-600); }
        .stat-icon.amber  { background: var(--amber-100);   color: var(--amber-500);   }
        .stat-icon.red    { background: var(--red-100);     color: var(--red-600);     }
        .stat-icon.indigo { background: var(--indigo-100);  color: var(--indigo-600);  }

        /* ── Tables ──────────────────────────────────────────────── */
        .table-card {
            border: 1px solid var(--slate-200);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .table { margin: 0; }
        .table thead th {
            background: var(--slate-50);
            color: var(--slate-500);
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            border-bottom: 1px solid var(--slate-200);
            border-top: none;
            padding: .75rem 1rem;
            white-space: nowrap;
        }
        .table td {
            vertical-align: middle;
            border-color: var(--slate-100);
            padding: .875rem 1rem;
            font-size: .875rem;
            color: var(--slate-700);
        }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover td { background: var(--indigo-50); }
        .table tbody tr { transition: background .1s ease; }

        /* ── Badges ──────────────────────────────────────────────── */
        .badge { font-weight: 500; border-radius: 20px; padding: .3em .75em; font-size: .75rem; }
        .badge-indigo { background: var(--indigo-100); color: var(--indigo-800); }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn { border-radius: 8px; font-weight: 500; font-size: .875rem; transition: all .15s ease; }
        .btn-primary { background: var(--indigo-600); border-color: var(--indigo-600); }
        .btn-primary:hover { background: var(--indigo-800); border-color: var(--indigo-800); box-shadow: 0 4px 12px rgba(79,70,229,.25); }
        .btn-sm { border-radius: 6px; font-size: .8rem; }
        .btn-icon { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }

        /* ── Search bar ──────────────────────────────────────────── */
        .search-bar .form-control {
            border-radius: 8px 0 0 8px;
            border-right: none;
            font-size: .875rem;
        }
        .search-bar .btn { border-radius: 0 8px 8px 0; }

        /* ── Forms ───────────────────────────────────────────────── */
        .form-label { font-size: .8125rem; font-weight: 600; color: var(--slate-700); margin-bottom: .35rem; }
        .form-control, .form-select {
            border-color: var(--slate-300);
            border-radius: 8px;
            font-size: .875rem;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }
        .form-control.is-invalid, .form-select.is-invalid { border-color: var(--red-600); }
        .form-card { max-width: 620px; }

        /* ── Alert toasts ────────────────────────────────────────── */
        .alert { border-radius: 10px; border: none; font-size: .875rem; }
        .alert-success { background: var(--emerald-100); color: #065f46; }
        .alert-danger  { background: var(--red-100);     color: #991b1b; }

        /* ── Pagination ──────────────────────────────────────────── */
        .pagination .page-link {
            border-radius: 8px;
            border: 1px solid var(--slate-200);
            color: var(--slate-700);
            font-size: .8rem;
            margin: 0 2px;
            padding: .4rem .75rem;
        }
        .pagination .page-item.active .page-link {
            background: var(--indigo-600);
            border-color: var(--indigo-600);
        }
        .pagination .page-link:hover { background: var(--indigo-50); color: var(--indigo-600); }

        /* ── Back button ─────────────────────────────────────────── */
        .btn-back {
            width: 34px; height: 34px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--slate-200);
            background: #fff;
            color: var(--slate-700);
            transition: all .15s ease;
        }
        .btn-back:hover { background: var(--slate-100); color: var(--slate-900); }

        /* ── Empty state ─────────────────────────────────────────── */
        .empty-state { padding: 3rem 1rem; text-align: center; color: var(--slate-500); }
        .empty-state i { font-size: 2.5rem; opacity: .4; margin-bottom: .75rem; display: block; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row g-0">

        <!-- ── Sidebar ─────────────────────────────────────────── -->
        <nav class="col-md-2 d-none d-md-flex flex-column sidebar py-0">
            <!-- Brand -->
            <a th:href="@{/dashboard}" class="sidebar-brand">
                <div class="sidebar-brand-icon"><i class="bi bi-book-half"></i></div>
                <span>Bibliothèque</span>
            </a>

            <!-- Nav -->
            <ul class="nav flex-column gap-1 px-2">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"
                       th:classappend="${currentUri == '/dashboard' or currentUri == '/'} ? 'active'">
                        <i class="bi bi-speedometer2"></i>Tableau de bord
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/livres}"
                       th:classappend="${#strings.startsWith(currentUri, '/livres')} ? 'active'">
                        <i class="bi bi-journals"></i>Livres
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/membres}"
                       th:classappend="${#strings.startsWith(currentUri, '/membres')} ? 'active'">
                        <i class="bi bi-people"></i>Membres
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/emprunts}"
                       th:classappend="${#strings.startsWith(currentUri, '/emprunts')} ? 'active'">
                        <i class="bi bi-arrow-left-right"></i>Emprunts
                    </a>
                </li>
            </ul>

            <!-- Spacer -->
            <div class="flex-grow-1"></div>

            <!-- Footer -->
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-avatar" sec:authentication="name">U</div>
                    <span class="sidebar-username" sec:authentication="name">Utilisateur</span>
                </div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                    </button>
                </form>
            </div>
        </nav>

        <!-- ── Main content ────────────────────────────────────── -->
        <main class="col-md-10 main-content px-4 py-4">
            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <!-- Page content -->
            <div layout:fragment="content"></div>
        </main>

    </div>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
