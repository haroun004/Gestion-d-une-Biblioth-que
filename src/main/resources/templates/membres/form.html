<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${action + ' un membre'}">Membre</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/membres}" class="btn-back"><i class="bi bi-arrow-left"></i></a>
            <h2 th:text="${action + ' un membre'}">Membre</h2>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form th:action="@{/membres/sauvegarder}" th:object="${membre}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prénom <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{prenom}" class="form-control"
                               placeholder="Prénom"
                               th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{prenom}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{nom}" class="form-control"
                               placeholder="Nom de famille"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nom}"></div>
                    </div>
                </div>

                <div style="margin-top:.9rem">
                    <label class="form-label">Email <span style="color:#dc2626">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="exemple@domaine.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div style="margin-top:.9rem">
                    <label class="form-label">Date d'inscription</label>
                    <input type="date" th:field="*{dateInscription}" class="form-control"
                           style="max-width:220px"/>
                    <div style="font-size:.75rem;color:#64748b;margin-top:.3rem">
                        Laissez vide pour utiliser la date du jour.
                    </div>
                </div>

                <div style="margin-top:.9rem">
                    <label class="form-label d-flex align-items-center gap-2" for="actif">
                        <input type="checkbox" th:field="*{actif}" class="form-check-input" id="actif"
                               style="width:18px;height:18px;border-radius:5px;border-color:#cbd5e1"/>
                        Membre actif
                    </label>
                </div>

                <hr style="border-color:#e2e8f0;margin:1.5rem 0 1rem">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Sauvegarder
                    </button>
                    <a th:href="@{/membres}" class="btn"
                       style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
