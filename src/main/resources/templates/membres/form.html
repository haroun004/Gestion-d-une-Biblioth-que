<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${action + ' un membre'}">Membre</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/membres}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${action + ' un membre'}">Membre</h2>
    </div>

    <div class="card" style="max-width:500px">
        <div class="card-body">
            <form th:action="@{/membres/sauvegarder}" th:object="${membre}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label fw-semibold">Nom *</label>
                        <input type="text" th:field="*{nom}" class="form-control"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nom}"></div>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label fw-semibold">Prénom *</label>
                        <input type="text" th:field="*{prenom}" class="form-control"
                               th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{prenom}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email *</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Date d'inscription</label>
                    <input type="date" th:field="*{dateInscription}" class="form-control"/>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" th:field="*{actif}" class="form-check-input" id="actif"/>
                    <label class="form-check-label" for="actif">Membre actif</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i>Sauvegarder
                    </button>
                    <a th:href="@{/membres}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
