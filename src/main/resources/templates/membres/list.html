<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Membres</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people me-2"></i>Membres</h2>
        <a th:href="@{/membres/nouveau}" class="btn btn-success">
            <i class="bi bi-person-plus me-1"></i>Ajouter
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/membres}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="search" class="form-control"
                   placeholder="Rechercher par nom, prénom ou email..."
                   th:value="${search}"/>
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
            <a th:href="@{/membres}" class="btn btn-outline-danger" th:if="${search != null and !search.isEmpty()}">
                <i class="bi bi-x"></i>
            </a>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Inscription</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${membresPage.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">Aucun membre trouvé.</td>
                    </tr>
                    <tr th:each="membre : ${membresPage.content}">
                        <td th:text="${membre.id}"></td>
                        <td th:text="${membre.nom}"></td>
                        <td th:text="${membre.prenom}"></td>
                        <td th:text="${membre.email}"></td>
                        <td th:text="${#temporals.format(membre.dateInscription, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:if="${membre.actif}" class="badge bg-success">Actif</span>
                            <span th:unless="${membre.actif}" class="badge bg-secondary">Inactif</span>
                        </td>
                        <td>
                            <a th:href="@{/membres/{id}/modifier(id=${membre.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/membres/{id}/supprimer(id=${membre.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce membre ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${membresPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${membresPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/membres(page=${membresPage.number - 1}, search=${search})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, membresPage.totalPages - 1)}"
                th:classappend="${i == membresPage.number} ? 'active'">
                <a class="page-link" th:href="@{/membres(page=${i}, search=${search})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${membresPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/membres(page=${membresPage.number + 1}, search=${search})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
