<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Erreur</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
</head>
<body class="bg-light">
<div class="container text-center mt-5">
    <i class="bi bi-exclamation-octagon" style="font-size:4rem;color:#dc3545"></i>
    <h1 class="mt-3" th:text="${status}">Erreur</h1>
    <p class="text-muted" th:text="${message}">Une erreur s'est produite.</p>
    <a href="/dashboard" class="btn btn-dark mt-2">
        <i class="bi bi-house me-1"></i>Retour au tableau de bord
    </a>
</div>
</body>
</html>
