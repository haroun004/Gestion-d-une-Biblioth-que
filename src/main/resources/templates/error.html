<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Erreur — Bibliothèque FST</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <style>
        body {
            background: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .error-card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.07);
        }
        .error-icon-wrap {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #fee2e2;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -.04em;
            line-height: 1;
            margin-bottom: .5rem;
        }
        .error-msg {
            font-size: .9375rem;
            color: #64748b;
            margin-bottom: 1.75rem;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex; align-items: center; gap: .4rem;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff; border: none; border-radius: 10px;
            padding: .65rem 1.5rem; font-size: .9rem; font-weight: 600;
            text-decoration: none; transition: opacity .15s ease;
        }
        .btn-home:hover { opacity: .88; color: #fff; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon-wrap">
        <i class="bi bi-exclamation-octagon-fill" style="font-size:2rem;color:#dc2626"></i>
    </div>
    <div class="error-code" th:text="${status}">Erreur</div>
    <div class="error-msg" th:text="${message}">Une erreur inattendue s'est produite.</div>
    <a href="/dashboard" class="btn-home">
        <i class="bi bi-house"></i>Retour au tableau de bord
    </a>
</div>
</body>
</html>
