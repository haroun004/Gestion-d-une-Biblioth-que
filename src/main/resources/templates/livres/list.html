<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Livres</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <h2><i class="bi bi-journals"></i>Livres</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addLivreModal">
            <i class="bi bi-plus-lg me-1"></i>Ajouter un livre
        </button>
    </div>

    <!-- Search -->
    <form th:action="@{/livres}" method="get" class="mb-3">
        <div class="input-group search-bar" style="max-width:480px">
            <span class="input-group-text" style="background:#fff;border-color:#cbd5e1;border-right:none">
                <i class="bi bi-search" style="color:#94a3b8"></i>
            </span>
            <input type="text" name="search" class="form-control"
                   style="border-left:none;border-radius:0"
                   placeholder="Titre, auteur ou catégorie…"
                   th:value="${search}"/>
            <button class="btn" type="submit"
                    style="background:#4f46e5;color:#fff;border-color:#4f46e5;border-radius:0 8px 8px 0">Rechercher</button>
            <a th:href="@{/livres}" class="btn btn-outline-secondary ms-1"
               style="border-radius:8px" th:if="${search != null and !search.isEmpty()}">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </form>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Titre</th>
                        <th>Auteur</th>
                        <th>ISBN</th>
                        <th>Catégorie</th>
                        <th>Total</th>
                        <th>Disponible</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${livresPage.isEmpty()}">
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="bi bi-journals"></i>
                                <div style="font-weight:600;margin-bottom:.25rem">Aucun livre trouvé</div>
                                <div style="font-size:.8rem">Essayez un autre terme de recherche ou ajoutez un livre.</div>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="livre : ${livresPage.content}">
                        <td style="color:#94a3b8;font-size:.8rem" th:text="${livre.id}"></td>
                        <td style="font-weight:500;color:#0f172a" th:text="${livre.titre}"></td>
                        <td th:text="${livre.auteur}"></td>
                        <td><code style="font-size:.78rem;background:#f1f5f9;padding:.15rem .4rem;border-radius:4px" th:text="${livre.isbn}"></code></td>
                        <td><span class="badge badge-indigo" th:text="${livre.categorie}"></span></td>
                        <td th:text="${livre.quantiteTotal}"></td>
                        <td>
                            <span th:if="${livre.quantiteDisponible == 0}"
                                  class="badge" style="background:#fee2e2;color:#991b1b"
                                  th:text="${livre.quantiteDisponible}"></span>
                            <span th:unless="${livre.quantiteDisponible == 0}"
                                  class="badge" style="background:#d1fae5;color:#065f46"
                                  th:text="${livre.quantiteDisponible}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/livres/{id}/modifier(id=${livre.id})}"
                                   class="btn btn-sm btn-icon"
                                   style="border:1px solid #e2e8f0;background:#fff;color:#4f46e5"
                                   title="Modifier">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/livres/{id}/supprimer(id=${livre.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Supprimer ce livre ?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-icon"
                                            style="border:1px solid #e2e8f0;background:#fff;color:#dc2626"
                                            title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${livresPage.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${livresPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/livres(page=${livresPage.number - 1}, search=${search})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, livresPage.totalPages - 1)}"
                th:classappend="${i == livresPage.number} ? 'active'">
                <a class="page-link" th:href="@{/livres(page=${i}, search=${search})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${livresPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/livres(page=${livresPage.number + 1}, search=${search})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- ── Modal : Ajouter un livre ──────────────────────────── -->
    <div class="modal fade" id="addLivreModal" tabindex="-1" aria-labelledby="addLivreModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="border-radius:16px;border:none;box-shadow:0 20px 60px rgba(0,0,0,.18)">

                <div class="modal-header" style="border-bottom:1px solid #e2e8f0;padding:1.25rem 1.5rem">
                    <div style="display:flex;align-items:center;gap:.65rem">
                        <div class="stat-icon blue" style="width:36px;height:36px;font-size:.95rem;flex-shrink:0">
                            <i class="bi bi-journal-plus"></i>
                        </div>
                        <h5 class="modal-title mb-0 fw-bold" id="addLivreModalLabel">Ajouter un livre</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-4">
                    <form th:action="@{/livres/sauvegarder}" th:object="${nouveauLivre}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Titre <span style="color:#dc2626">*</span></label>
                                <input type="text" th:field="*{titre}" class="form-control" placeholder="Ex&#58; Introduction à l'algorithmique"
                                       th:classappend="${#fields.hasErrors('titre')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{titre}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Catégorie <span style="color:#dc2626">*</span></label>
                                <input type="text" th:field="*{categorie}" class="form-control" placeholder="Ex&#58; Informatique"
                                       th:classappend="${#fields.hasErrors('categorie')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{categorie}"></div>
                            </div>
                        </div>

                        <div class="row g-3" style="margin-top:.75rem">
                            <div class="col-md-6">
                                <label class="form-label">Auteur <span style="color:#dc2626">*</span></label>
                                <input type="text" th:field="*{auteur}" class="form-control" placeholder="Nom Prénom"
                                       th:classappend="${#fields.hasErrors('auteur')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{auteur}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ISBN <span style="color:#dc2626">*</span></label>
                                <input type="text" th:field="*{isbn}" class="form-control" placeholder="978-XXXXXXXXXX"
                                       th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{isbn}"></div>
                            </div>
                        </div>

                        <div class="row g-3" style="margin-top:.75rem">
                            <div class="col-6">
                                <label class="form-label">Qté totale <span style="color:#dc2626">*</span></label>
                                <input type="number" th:field="*{quantiteTotal}" class="form-control" min="0" value="1"
                                       th:classappend="${#fields.hasErrors('quantiteTotal')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{quantiteTotal}"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Qté disponible <span style="color:#dc2626">*</span></label>
                                <input type="number" th:field="*{quantiteDisponible}" class="form-control" min="0" value="1"
                                       th:classappend="${#fields.hasErrors('quantiteDisponible')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{quantiteDisponible}"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end" style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0">
                            <button type="button" class="btn"
                                    style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155"
                                    data-bs-dismiss="modal">Annuler</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Ajouter
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
