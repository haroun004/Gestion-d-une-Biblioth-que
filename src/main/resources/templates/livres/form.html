<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${action + ' un livre'}">Livre</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/livres}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0" th:text="${action + ' un livre'}">Livre</h2>
    </div>

    <div class="card" style="max-width:600px">
        <div class="card-body">
            <form th:action="@{/livres/sauvegarder}" th:object="${livre}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Titre *</label>
                    <input type="text" th:field="*{titre}" class="form-control"
                           th:classappend="${#fields.hasErrors('titre')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{titre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Auteur *</label>
                    <input type="text" th:field="*{auteur}" class="form-control"
                           th:classappend="${#fields.hasErrors('auteur')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{auteur}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">ISBN *</label>
                    <input type="text" th:field="*{isbn}" class="form-control"
                           th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{isbn}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Catégorie *</label>
                    <input type="text" th:field="*{categorie}" class="form-control"
                           th:classappend="${#fields.hasErrors('categorie')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{categorie}"></div>
                </div>

                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label fw-semibold">Quantité totale *</label>
                        <input type="number" th:field="*{quantiteTotal}" class="form-control" min="0"
                               th:classappend="${#fields.hasErrors('quantiteTotal')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{quantiteTotal}"></div>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label fw-semibold">Quantité disponible *</label>
                        <input type="number" th:field="*{quantiteDisponible}" class="form-control" min="0"
                               th:classappend="${#fields.hasErrors('quantiteDisponible')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{quantiteDisponible}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Sauvegarder
                    </button>
                    <a th:href="@{/livres}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
