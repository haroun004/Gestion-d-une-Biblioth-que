<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${action + ' un livre'}">Livre</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/livres}" class="btn-back"><i class="bi bi-arrow-left"></i></a>
            <h2 th:text="${action + ' un livre'}">Livre</h2>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body p-4">
            <form th:action="@{/livres/sauvegarder}" th:object="${livre}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3 mb-1">
                    <div class="col-md-8">
                        <label class="form-label">Titre <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{titre}" class="form-control"
                               placeholder="Ex: Introduction à l'algorithmique"
                               th:classappend="${#fields.hasErrors('titre')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{titre}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Catégorie <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{categorie}" class="form-control"
                               placeholder="Ex: Informatique"
                               th:classappend="${#fields.hasErrors('categorie')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{categorie}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-1" style="margin-top:.75rem">
                    <div class="col-md-6">
                        <label class="form-label">Auteur <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{auteur}" class="form-control"
                               placeholder="Nom de l'auteur"
                               th:classappend="${#fields.hasErrors('auteur')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{auteur}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ISBN <span style="color:#dc2626">*</span></label>
                        <input type="text" th:field="*{isbn}" class="form-control"
                               placeholder="978-XXXXXXXXXX"
                               th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{isbn}"></div>
                    </div>
                </div>

                <div class="row g-3" style="margin-top:.75rem">
                    <div class="col-6">
                        <label class="form-label">Quantité totale <span style="color:#dc2626">*</span></label>
                        <input type="number" th:field="*{quantiteTotal}" class="form-control" min="0"
                               th:classappend="${#fields.hasErrors('quantiteTotal')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{quantiteTotal}"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Quantité disponible <span style="color:#dc2626">*</span></label>
                        <input type="number" th:field="*{quantiteDisponible}" class="form-control" min="0"
                               th:classappend="${#fields.hasErrors('quantiteDisponible')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{quantiteDisponible}"></div>
                    </div>
                </div>

                <hr style="border-color:#e2e8f0;margin:1.5rem 0 1rem">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Sauvegarder
                    </button>
                    <a th:href="@{/livres}" class="btn"
                       style="background:#f1f5f9;border:1px solid #e2e8f0;color:#334155">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
